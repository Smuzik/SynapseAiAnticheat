name: SynapseAiAnticheat
version: '${version}'
main: net.synapselabs.anticheat.AiAnticheatPlugin
api-version: '1.16'
authors: [Даня (smyzik / smerchhh), SynapseLabs]
website: https://dsc.gg/synapselabs
description: Next-Gen AI Machine Learning & Hybrid Anticheat for Spigot, Paper and Purpur
softdepend: [GrimAC]
commands:
  aianticheat:
    description: Главная команда управления Synapse AI-AntiCheat
    permission: aianticheat.admin
    aliases: [aiac, synapse, synapseac]
permissions:
  aianticheat.admin:
    description: Полные права администратора Synapse AI-AntiCheat
    default: op
  aianticheat.alerts:
    description: Получение алертов о читерах в реальном времени
    default: op
  aianticheat.freeze:
    description: Право на заморозку подозрительных игроков
    default: op
